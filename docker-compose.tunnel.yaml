name: couchdb
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: couchdb:latest
    container_name: couchdb-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: couchdb-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      COUCHDB_USER: ${DB_ADMIN_NAME:-admin}
      COUCHDB_PASSWORD: ${DB_ADMIN_PASS:-changeme_admin_password}
    volumes:
      - './volumes/db/couchdb/couchdb:/opt/couchdb/data:z'
      - './volumes/log/couchdb:/opt/couchdb/var/log:z'
      - './volumes/config/couchdb:/opt/couchdb/etc/local.d:z'
    labels:
      - 'cloudflare.enable=true'
      - 'cloudflare.service=http://couchdb-app:5984'
      - 'cloudflare.hostname=${BASE_HOST_NAME:-$HOSTNAME}'
    networks:
      - couchdb
      - cloudflare


networks:
  couchdb:
    name: couchdb
    external: false
  cloudflare:
    external: true
